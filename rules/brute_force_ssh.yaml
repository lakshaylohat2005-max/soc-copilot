id: RULE-AUTH-001
name: SSH Brute Force Attack
description: Multiple consecutive failed authentication attempts followed by a potential compromise from a single source IP.
severity: HIGH
mitre:
  tactic: Credential Access
  technique_id: T1110.001
  technique_name: "Brute Force: Password Guessing"
criteria:
  source: auth
  event_type: login_failed
  threshold: 5
  time_window_seconds: 60
  group_by: source_ip
action_recommendations:
  - action_type: block_ip
    description: Add source IP to host firewall drop list
  - action_type: disable_user
    description: Lock targeted user account if authentication succeeded

